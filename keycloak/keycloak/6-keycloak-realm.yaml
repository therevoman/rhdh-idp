---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: rhdh-realm
  namespace: demo-project
spec:
  keycloakCRName: demo-keycloak-instance
  realm:
    id: rhdh
    realm: rhdh
    displayName: "RHDH Realm"
    enabled: true
    browserFlow: browser
    identityProviders:
      - alias: github
        displayName: "GitHub"
        providerId: github
        enabled: true
        trustEmail: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        authenticateByDefault: false
        linkOnly: false
        firstBrokerLoginFlowAlias: first broker login
        config:
          clientId: "Ov23liB8Iml3xrj2St5B"
          clientSecret: "3f939c4919c336c36936a2be47b4fda8756c6e3a"
          defaultScope: "user:email"
    clients:
      - clientId: rhdh
        name: rhdh
        description: Red Hat Developer Hub Client
        enabled: true
        protocol: openid-connect
        publicClient: false
        redirectUris:
          - "https://rhdh.apps.ocs.openshift.works/api/auth/*"
        rootUrl: "https://rhdh.apps.ocs.openshift.works"
        adminUrl: "https://rhdh.apps.ocs.openshift.works"
        baseUrl: "https://rhdh.apps.ocs.openshift.works"
        webOrigins:
          - "+"
        secret: "developer-hub-secret"
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        authorizationServicesEnabled: false
...
