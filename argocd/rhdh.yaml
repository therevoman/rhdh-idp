---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devhub-deploy
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: rhdh
    repoURL: https://github.com/therevoman/rhdh-idp.git
    targetRevision: phase-1-work
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
        - /spec/installPlanApproval
        - /spec/startingCSV
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
...
